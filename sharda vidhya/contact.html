<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - S.V.M. Public School</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
      background: #eef3f9;
    }

    header {
      background: linear-gradient(90deg, #0072ff, #00c6ff);
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    header h1 {
      margin: 0;
      font-size: 2.2em;
    }

    nav {
      background-color: #222;
      text-align: center;
      padding: 10px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      display: inline-block;
      font-weight: bold;
    }

    nav a:hover {
      background-color: #00c6ff;
      color: black;
      border-radius: 5px;
    }

    .form-section {
      padding: 40px;
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin-top: 40px;
    }

    .form-section h2 {
      text-align: center;
      color: #0072ff;
      margin-bottom: 30px;
      border-bottom: 3px solid #00c6ff;
      display: inline-block;
      padding-bottom: 10px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: bold;
      color: #333;
    }

    input, textarea {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1em;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #00c6ff;
      box-shadow: 0 0 5px rgba(0,198,255,0.5);
    }

    button {
      padding: 12px;
      background: linear-gradient(90deg, #0072ff, #00c6ff);
      border: none;
      color: white;
      font-size: 1.1em;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: linear-gradient(90deg, #005bea, #00aaff);
    }

    .map-section {
      margin: 40px auto;
      max-width: 700px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    iframe {
      width: 100%;
      height: 400px;
      border: 0;
    }

    footer {
      background-color: #222;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
    }

    .success {
      text-align: center;
      color: green;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>S.V.M. Public School</h1>
    <p>Contact Us</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="teachers.html">Teachers</a>
    <a href="students.html">Students</a>
    <a href="admission.html">Admission</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section class="form-section">
    <h2>Contact Form</h2>

    <form id="contactForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter email address" required>

      <label for="phone">Contact Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter contact number" required>

      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <p class="success" id="successMessage">✅ Your message has been sent successfully!</p>
  </section>

  <!-- Google Maps Section -->
  <section class="map-section">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3770.0000000000004!2d72.0000000000000!3d19.0000000000000!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0000000000000000!2sS.V.M.%20Public%20School!5e0!3m2!1sen!2sin!4v1700000000000" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </section>

  <footer>
    <p>&copy; 2025 S.V.M. Public School | Designed by KRISHHH STUDIO</p>
  </footer>

  <script>
    // Form submission simulation
    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("successMessage").style.display = "block";
      this.reset();
    });
  </script>
</body>
</html>
